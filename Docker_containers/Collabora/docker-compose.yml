services:
  collabora:
    image: collabora/code:latest
    container_name: collabora
    restart: unless-stopped
    cap_add:
      - MKNOD
    ports:
      - "${COLLABORA_PORT:-9980}:9980"
    environment:
      username: "${COLLABORA_USERNAME:-admin}"
      password: "${COLLABORA_PASSWORD:-change_me}"
      dictionaries: "${COLLABORA_DICTIONARIES:-en_GB en_US ro_RO}"

      # Public hostname for Collabora itself, without scheme.
      # Example: office.example.com
      server_name: "${COLLABORA_SERVER_NAME:-localhost:9980}"

      # Allowed WOPI host/application URL.
      # Example for Laravel local dev: http://host.docker.internal:8000
      # Example for production: https://app.example.com
      aliasgroup1: "${COLLABORA_ALIASGROUP1:-http://host.docker.internal:8000}"

      # For direct local HTTP, keep ssl.termination=false.
      # Behind an HTTPS reverse proxy, set:
      # COLLABORA_EXTRA_PARAMS=--o:ssl.enable=false --o:ssl.termination=true --o:logging.level=warning --o:net.frame_ancestors=https://app.example.com
      #
      # Keep frame ancestors permissive for local dev because the browser can
      # frame Collabora from localhost, 127.0.0.1, or a Vite/php artisan port.
      # Use a concrete origin in production.
      extra_params: "${COLLABORA_EXTRA_PARAMS:---o:ssl.enable=false --o:ssl.termination=false --o:logging.level=warning --o:net.frame_ancestors=${COLLABORA_FRAME_ANCESTORS:-*}}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9980/hosting/discovery >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
